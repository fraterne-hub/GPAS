{% extends "base.html" %}
{% load i18n %}
{% block title %}403 — {% trans "Access Denied" %}{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="garl-error-page">
    <div class="garl-error-code">403</div>
    <h2 class="garl-error-title">{% trans "Access Denied" %}</h2>
    <p class="garl-error-desc text-muted">{% trans "You do not have permission to access this page." %}</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="{% url 'core:home' %}" class="btn btn-garl-gold"><i class="bi bi-house me-2"></i>{% trans "Go Home" %}</a>
      <a href="{% url 'dashboard:home' %}" class="btn btn-outline-primary"><i class="bi bi-speedometer2 me-2"></i>{% trans "Dashboard" %}</a>
    </div>
  </div>
</div>
{% endblock %}
