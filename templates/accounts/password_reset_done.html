{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Email Sent" %}{% endblock %}
{% block content %}
<div class="garl-auth-page"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<div class="garl-auth-card text-center p-4">
  <i class="bi bi-envelope-check fs-1 text-success mb-3 d-block"></i>
  <h3>{% trans "Check your email" %}</h3>
  <p class="text-muted">{% trans "If an account exists with that email, you'll receive password reset instructions." %}</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-garl-gold">{% trans "Back to Sign In" %}</a>
</div>
</div></div></div></div>
{% endblock %}
