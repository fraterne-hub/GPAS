{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Password Reset Complete" %}{% endblock %}
{% block content %}
<div class="garl-auth-page"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<div class="garl-auth-card text-center p-4">
  <i class="bi bi-check-circle-fill fs-1 text-success mb-3 d-block"></i>
  <h3>{% trans "Password Reset Complete" %}</h3>
  <p class="text-muted">{% trans "Your password has been reset. You can now sign in." %}</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-garl-gold">{% trans "Sign In" %}</a>
</div>
</div></div></div></div>
{% endblock %}
